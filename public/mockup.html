<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triodos — iPhone 17 Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #ffffff;
      font-family: system-ui, sans-serif;
    }

    .scene {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* ── iPhone 17 shell ── */
    .phone {
      position: relative;
      width: 430px;
      height: 932px;
      background: linear-gradient(160deg, #2c2c2e 0%, #1c1c1e 40%, #111 100%);
      border-radius: 54px;
      box-shadow:
        0 0 0 1.5px #3a3a3c,
        0 0 0 3px #1c1c1e,
        0 40px 120px rgba(0,0,0,0.85),
        0 8px 32px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Titanium side rail shimmer */
    .phone::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 54px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.12) 0%,
        transparent 30%,
        transparent 70%,
        rgba(255,255,255,0.05) 100%
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Side buttons */
    .btn-volume-up,
    .btn-volume-down,
    .btn-silent,
    .btn-power {
      position: absolute;
      background: linear-gradient(90deg, #2c2c2e, #3a3a3c);
      border-radius: 3px;
    }
    .btn-silent {
      left: -4px; top: 140px;
      width: 4px; height: 36px;
      border-radius: 3px 0 0 3px;
    }
    .btn-volume-up {
      left: -4px; top: 196px;
      width: 4px; height: 64px;
      border-radius: 3px 0 0 3px;
    }
    .btn-volume-down {
      left: -4px; top: 272px;
      width: 4px; height: 64px;
      border-radius: 3px 0 0 3px;
    }
    .btn-power {
      right: -4px; top: 196px;
      width: 4px; height: 80px;
      border-radius: 0 3px 3px 0;
    }

    /* Screen bezel */
    .screen-bezel {
      position: absolute;
      inset: 10px;
      border-radius: 46px;
      background: #F3EDE4;
      overflow: hidden;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 20;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* App iframe — full screen, app handles its own safe-area insets */
    .app-frame {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: none;
      width: 100%;
      height: 100%;
      border-radius: 46px;
    }

    /* Screen glare overlay */
    .glare {
      position: absolute;
      inset: 0;
      border-radius: 46px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.06) 0%,
        transparent 50%
      );
      pointer-events: none;
      z-index: 30;
    }

    /* Status bar spacer inside app */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 54px;
      z-index: 15;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 28px 0;
      pointer-events: none;
    }
    .status-time {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-icons svg {
      fill: #ffffff;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="phone">
      <!-- Physical buttons -->
      <div class="btn-silent"></div>
      <div class="btn-volume-up"></div>
      <div class="btn-volume-down"></div>
      <div class="btn-power"></div>

      <!-- Screen -->
      <div class="screen-bezel">
        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>

        <!-- Status bar -->
        <div class="status-bar">
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <!-- Signal -->
            <svg width="17" height="12" viewBox="0 0 17 12">
              <rect x="0" y="7" width="3" height="5" rx="1"/>
              <rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/>
              <rect x="9" y="2" width="3" height="10" rx="1"/>
              <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
            </svg>
            <!-- WiFi -->
            <svg width="16" height="12" viewBox="0 0 16 12">
              <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
              <path d="M3.5 6.5a6.5 6.5 0 019 0" stroke="#1c1c1e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M0.5 3.5a10.5 10.5 0 0115 0" stroke="#1c1c1e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
            <!-- Battery -->
            <svg width="25" height="12" viewBox="0 0 25 12">
              <rect x="0" y="1" width="21" height="10" rx="3" stroke="#1c1c1e" stroke-width="1.2" fill="none"/>
              <rect x="22" y="3.5" width="2" height="5" rx="1" fill="#1c1c1e" opacity="0.4"/>
              <rect x="1.5" y="2.5" width="16" height="7" rx="2" fill="#1c1c1e"/>
            </svg>
          </div>
        </div>

        <!-- App -->
        <iframe
          class="app-frame"
          src="http://127.0.0.1:3001/login"
          title="Triodos App"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        ></iframe>

        <!-- Glare -->
        <div class="glare"></div>
      </div>
    </div>
  </div>
  <script>
    function fitScene() {
      const scene = document.querySelector('.scene');
      const PW = 430 + 80, PH = 932 + 80;
      const scale = Math.min(window.innerWidth / PW, window.innerHeight / PH, 1);
      const x = (window.innerWidth  - PW * scale) / 2;
      const y = (window.innerHeight - PH * scale) / 2;
      scene.style.position = 'absolute';
      scene.style.top  = '0';
      scene.style.left = '0';
      scene.style.transformOrigin = 'top left';
      scene.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }
    window.addEventListener('load',   fitScene);
    window.addEventListener('resize', fitScene);
  </script>
</body>
</html>
